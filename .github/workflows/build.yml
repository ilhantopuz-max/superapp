name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Debug APK derle
        run: gradle :app:assembleDebug --stacktrace

      - name: Debug APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: CEO-ASISTANIM-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Aşağıdaki adımlar yalnızca KEYSTORE_BASE64 secret'ı tanımlıysa çalışır
      - name: Keystore hazırla
        if: env.KS_B64 != ''
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: İmzalı release APK derle
        if: env.KS_B64 != ''
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Release APK yükle
        if: env.KS_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: CEO-ASISTANIM-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: GitHub Release oluştur (v* etiketi)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
